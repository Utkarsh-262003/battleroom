[defaults]
inventory = inventory.ini
host_key_checking = True
interpreter_python = auto_silent
# Facts are read as ansible_facts['name']. The old top-level ansible_name
# variables stop working in ansible-core 2.24; turning them off now means
# any leftover use fails today instead of on the day of an upgrade.
inject_facts_as_vars = False

[ssh_connection]
pipelining = True