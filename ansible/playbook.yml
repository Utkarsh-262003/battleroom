- name: Set up the app box
  hosts: battleroom
  become: true

  vars:
    # The pipeline passes the commit SHA it just built, or an older one
    # to roll back. Run by hand without it, the newest image is used.
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"

  roles:
    - base

  tasks:
    - name: Create Battleroom directory
      ansible.builtin.file:
        path: /opt/battleroom
        state: directory
        mode: '0755'

    - name: Create Nginx configuration directory
      ansible.builtin.file:
        path: /opt/battleroom/nginx
        state: directory
        mode: '0755'

    - name: Copy production Compose file
      ansible.builtin.copy:
        src: ../compose.prod.yaml
        dest: /opt/battleroom/compose.yaml
        mode: '0644'

    - name: Copy Nginx HTTP configuration
      ansible.builtin.copy:
        src: ../nginx/http.conf
        dest: /opt/battleroom/nginx/http.conf
        mode: '0644'
      notify: Reload Nginx

    - name: Copy environment file
      ansible.builtin.copy:
        src: ../.env
        dest: /opt/battleroom/.env
        mode: '0600'

    - name: Start Battleroom with image {{ image_tag }}
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/battleroom
      environment:
        IMAGE_TAG: "{{ image_tag }}"
      register: app_compose_up
      changed_when: app_compose_up.stderr is search('Created|Recreated|Started')

    - name: Remove unused Docker images
      ansible.builtin.command:
        cmd: docker image prune -af
      register: app_image_prune
      changed_when: "'Total reclaimed space: 0B' not in app_image_prune.stdout"

    - name: Get the HTTPS certificate
      ansible.builtin.include_role:
        name: certbot
      vars:
        certbot_domain: battleroom.utkarshtyagi.in
        certbot_reload_hook: "{{ playbook_dir }}/files/reload-nginx.sh"

    - name: Copy Nginx HTTPS configuration
      ansible.builtin.copy:
        src: ../nginx/https.conf
        dest: /opt/battleroom/nginx/https.conf
        mode: '0644'
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      ansible.builtin.command:
        cmd: docker compose exec nginx nginx -s reload
        chdir: /opt/battleroom
      changed_when: true


- name: Set up the monitoring box
  hosts: monitoring
  become: true

  pre_tasks:
    - name: Check Grafana admin password is provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'GRAFANA_ADMIN_PASSWORD') | length > 0
        fail_msg: "GRAFANA_ADMIN_PASSWORD is not set. Run this playbook through GitHub Actions or provide the environment variable."

    - name: Check Discord webhook is provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'DISCORD_WEBHOOK_URL') | length > 0
        fail_msg: "DISCORD_WEBHOOK_URL is not set. Run this playbook through GitHub Actions or provide the environment variable."

  roles:
    - base

  tasks:
    - name: Create Monitoring directories
      ansible.builtin.file:
        path: "/opt/monitoring/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - ""
        - nginx
        - prometheus
        - alertmanager
        - blackbox
        - grafana/provisioning/datasources
        - grafana/provisioning/dashboards
        - grafana/dashboards

    - name: Copy Prometheus configuration
      ansible.builtin.template:
        src: ../monitoring/prometheus.yml.j2
        dest: /opt/monitoring/prometheus/prometheus.yml
        mode: '0644'
      notify: Restart Prometheus

    - name: Copy Prometheus alert rules
      ansible.builtin.copy:
        src: ../monitoring/prometheus/alerts.yml
        dest: /opt/monitoring/prometheus/alerts.yml
        mode: '0644'
      notify: Restart Prometheus

    # It holds the Discord webhook URL, so only the user Alertmanager
    # runs as inside its container (nobody, 65534) can read it.
    - name: Template Alertmanager configuration
      ansible.builtin.template:
        src: ../monitoring/alertmanager/alertmanager.yml.j2
        dest: /opt/monitoring/alertmanager/alertmanager.yml
        owner: '65534'
        group: '65534'
        mode: '0400'
      notify: Restart Alertmanager

    - name: Copy blackbox exporter configuration
      ansible.builtin.copy:
        src: ../monitoring/blackbox/blackbox.yml
        dest: /opt/monitoring/blackbox/blackbox.yml
        mode: '0644'
      notify: Restart Blackbox

    - name: Copy Grafana data source configuration
      ansible.builtin.copy:
        src: ../monitoring/grafana/provisioning/datasources/prometheus.yml
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        mode: '0644'
      notify: Restart Grafana

    - name: Copy Grafana dashboard provider configuration
      ansible.builtin.copy:
        src: ../monitoring/grafana/provisioning/dashboards/dashboards.yml
        dest: /opt/monitoring/grafana/provisioning/dashboards/dashboards.yml
        mode: '0644'
      notify: Restart Grafana

    - name: Copy Grafana dashboards
      ansible.builtin.copy:
        src: ../monitoring/grafana/dashboards/
        dest: /opt/monitoring/grafana/dashboards/
        mode: '0644'
        directory_mode: '0755'

    - name: Create Grafana environment file
      ansible.builtin.copy:
        content: |
          GF_SECURITY_ADMIN_PASSWORD={{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}
          GF_SERVER_ROOT_URL=https://grafana.utkarshtyagi.in
        dest: /opt/monitoring/.env
        mode: '0600'

    - name: Copy monitoring Compose file
      ansible.builtin.copy:
        src: ../monitoring/compose.yaml
        dest: /opt/monitoring/compose.yaml
        mode: '0644'
      notify: Reload Nginx

    - name: Copy Nginx HTTP configuration
      ansible.builtin.copy:
        src: ../monitoring/nginx/http.conf
        dest: /opt/monitoring/nginx/http.conf
        mode: '0644'
      notify: Reload Nginx

    - name: Start Prometheus, Grafana, Alertmanager, blackbox exporter, and Nginx
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/monitoring
      register: monitoring_compose_up
      changed_when: monitoring_compose_up.stderr is search('Created|Recreated|Started')

    - name: Get the HTTPS certificate for Grafana
      ansible.builtin.include_role:
        name: certbot
      vars:
        certbot_domain: grafana.utkarshtyagi.in
        certbot_reload_hook: "{{ playbook_dir }}/files/reload-monitoring-nginx.sh"

    - name: Copy Nginx HTTPS configuration
      ansible.builtin.copy:
        src: ../monitoring/nginx/https.conf
        dest: /opt/monitoring/nginx/https.conf
        mode: '0644'
      notify: Reload Nginx

  handlers:
    - name: Restart Prometheus
      ansible.builtin.command:
        cmd: docker compose restart prometheus
        chdir: /opt/monitoring
      changed_when: true

    - name: Restart Alertmanager
      ansible.builtin.command:
        cmd: docker compose restart alertmanager
        chdir: /opt/monitoring
      changed_when: true

    - name: Restart Grafana
      ansible.builtin.command:
        cmd: docker compose restart grafana
        chdir: /opt/monitoring
      changed_when: true

    - name: Restart Blackbox
      ansible.builtin.command:
        cmd: docker compose restart blackbox
        chdir: /opt/monitoring
      changed_when: true

    - name: Reload Nginx
      ansible.builtin.command:
        cmd: docker compose exec nginx nginx -s reload
        chdir: /opt/monitoring
      changed_when: true
