- hosts: battleroom
  become: true

  tasks:
    - name: Install Docker, Compose, Certbot, and Node Exporter
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - certbot
          - prometheus-node-exporter
        update_cache: true

    - name: Make sure Docker is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Create Battleroom directory
      file:
        path: /opt/battleroom
        state: directory

    - name: Create Certbot challenge directory
      file:
        path: /var/www/certbot
        state: directory

    - name: Create Nginx configuration directory
      file:
        path: /opt/battleroom/nginx
        state: directory

    - name: Copy production Compose file
      copy:
        src: ../compose.prod.yaml
        dest: /opt/battleroom/compose.yaml

    - name: Copy Nginx HTTP configuration
      copy:
        src: ../nginx/http.conf
        dest: /opt/battleroom/nginx/http.conf
      notify: Reload Nginx

    - name: Copy environment file
      copy:
        src: ../.env
        dest: /opt/battleroom/.env
        mode: '0600'

    - name: Start Battleroom
      command:
        cmd: docker compose up -d
        chdir: /opt/battleroom
        
    - name: Remove unused Docker images
      command:
        cmd: docker image prune -af

    - name: Obtain Let's Encrypt certificate
      command:
        cmd: >
          certbot certonly
          --webroot
          -w /var/www/certbot
          -d battleroom.utkarshtyagi.in
          --email utkarshtyagi9050@gmail.com
          --agree-tos
          --non-interactive
        creates: /etc/letsencrypt/live/battleroom.utkarshtyagi.in/fullchain.pem

    - name: Install Certbot renewal hook
      copy:
        src: files/reload-nginx.sh
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        mode: '0755'

    - name: Copy Nginx HTTPS configuration
      copy:
        src: ../nginx/https.conf
        dest: /opt/battleroom/nginx/https.conf
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      command:
        cmd: docker compose exec nginx nginx -s reload
        chdir: /opt/battleroom


- hosts: monitoring
  become: true

  tasks:
    - name: Check Grafana admin password is provided
      ansible.builtin.assert:
        that:
          - lookup('env', 'GRAFANA_ADMIN_PASSWORD') | length > 0
        fail_msg: "GRAFANA_ADMIN_PASSWORD is not set. Run this playbook through GitHub Actions or provide the environment variable."

    - name: Install Docker and Compose
      apt:
        name:
          - docker.io
          - docker-compose-v2
        update_cache: true

    - name: Make sure Docker is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Create Monitoring directory
      file:
        path: /opt/monitoring
        state: directory

    - name: Create Prometheus configuration directory
      file:
        path: /opt/monitoring/prometheus
        state: directory

    - name: Create Grafana provisioning directory
      file:
        path: /opt/monitoring/grafana/provisioning/datasources
        state: directory

    - name: Copy Prometheus configuration
      template:
        src: ../monitoring/prometheus.yml.j2
        dest: /opt/monitoring/prometheus/prometheus.yml
      notify: Restart Prometheus

    - name: Copy Grafana data source configuration
      copy:
        src: ../monitoring/grafana/provisioning/datasources/prometheus.yml
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
      notify: Restart Grafana

    - name: Create Grafana environment file
      copy:
        content: |
          GF_SECURITY_ADMIN_PASSWORD={{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}
        dest: /opt/monitoring/.env
        mode: '0600'

    - name: Copy Prometheus and Grafana Compose file
      copy:
        src: ../monitoring/compose.yaml
        dest: /opt/monitoring/compose.yaml

    - name: Start Prometheus and Grafana
      command:
        cmd: docker compose up -d
        chdir: /opt/monitoring

  handlers:
    - name: Restart Prometheus
      command:
        cmd: docker compose restart prometheus
        chdir: /opt/monitoring

    - name: Restart Grafana
      command:
        cmd: docker compose restart grafana
        chdir: /opt/monitoring