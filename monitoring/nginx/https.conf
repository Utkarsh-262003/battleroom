server {
    listen 443 ssl;
    server_name grafana.utkarshtyagi.in;

    ssl_certificate /etc/letsencrypt/live/grafana.utkarshtyagi.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.utkarshtyagi.in/privkey.pem;

    # Health checks for the uptime check that runs in GitHub Actions.
    # Exact matches only: nothing else in Prometheus or Alertmanager is
    # reachable from outside.
    location = /healthz/prometheus {
        proxy_pass http://prometheus:9090/-/healthy;
    }

    location = /healthz/alertmanager {
        proxy_pass http://alertmanager:9093/-/healthy;
    }

    location / {
        proxy_pass http://grafana:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}